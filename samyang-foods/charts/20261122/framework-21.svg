<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1030 230" width="1030" height="230"><style>.grid{stroke:#e2e0d8;stroke-width:1}.zero{stroke:#8a8984;stroke-width:1}.base{stroke:#52514e;stroke-dasharray:5 4;stroke-width:1.2}.ax{fill:#52514e;font-size:11px}.dl{fill:#0b0b0b;font-size:11px;font-weight:600}text{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}</style><rect x="0" y="0" width="1030" height="230" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text font-size="14" font-weight="bold" x="10" y="20">아이디어가 체인에서 바꾸는 돈의 흐름 (2027~)</text>
<rect fill="#eef4fb" height="70" rx="8" stroke="#2f6db5" width="200" x="10" y="40"></rect><text font-size="12.5" font-weight="bold" x="20" y="64">국내 공장(원주·익산·밀양)</text><text font-size="11" x="20" y="84">약 28.4억식/년, 기본 가동률 92.3%</text><text font-size="11" x="20" y="100">(최근 4분기 약 96%, 낙관 100%)</text>
<rect fill="#eaf6ee" height="70" rx="8" stroke="#3a9a5b" width="200" x="10" y="140"></rect><text font-size="12.5" font-weight="bold" x="20" y="164">중국 자싱공장(2027.01)</text><text font-size="11" x="20" y="184">명목 11.3억식(추정), 기본 9.8억식(중국 수요)</text><text font-size="11" x="20" y="200">낙관 11.3억식 풀가동</text>
<rect fill="#fff4ea" height="70" rx="8" stroke="#e07b28" width="250" x="330" y="40"></rect><text font-size="12.5" font-weight="bold" x="340" y="64">미국·유럽 판매법인 → 유통</text><text font-size="11" x="340" y="84">kg 수출단가 미 $5.2, 유럽 $4.5~5</text><text font-size="11" x="340" y="100">월마트·크로거·멕시코 OXXO, 유럽 새 거래선</text>
<rect fill="#f6f6f6" height="70" rx="8" stroke="#888" width="250" x="330" y="140"></rect><text font-size="12.5" font-weight="bold" x="340" y="164">중국 판매법인 → 대리상·간식 채널</text><text font-size="11" x="340" y="184">kg 수출단가 $3.7, 간식 채널 37~38%</text><text font-size="11" x="340" y="200">중국 수요 9.8억식은 자싱이 맡음(추정)</text>
<rect fill="#f4f7fb" height="90" rx="8" stroke="#2f6db5" stroke-width="2" width="270" x="700" y="80"></rect><text font-size="12.5" font-weight="bold" text-anchor="middle" x="835" y="106">끝단 소비자(미·유럽·중국 가계)</text><text font-size="11" text-anchor="middle" x="835" y="126">같은 1봉을 더 비싼 시장에 → 매출↑</text><text font-size="11" text-anchor="middle" x="835" y="146">가격 인상 수용 여부 = P 사이클</text>
<line marker-end="url(#ar)" stroke="#e07b28" stroke-width="2.5" x1="210" x2="330" y1="75" y2="75"></line><line marker-end="url(#ar)" stroke="#3a9a5b" stroke-width="2.5" x1="210" x2="330" y1="175" y2="175"></line>
<line marker-end="url(#ar)" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1.2" x1="210" x2="330" y1="90" y2="165"></line><text fill="#888" font-size="10" x="215" y="132">이전: 국내→중국(줄어듦)</text>
